version: '3.8'

services:
  soccer-frontend:
    build: .
    container_name: soccer-manager-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - soccer-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Backend service reference (can be external)
  soccer-backend:
    image: soccer-manager-backend:latest
    container_name: soccer-manager-backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend/soccer_manager.db:/app/soccer_manager.db
      - ../backend/uploads:/app/uploads
    restart: unless-stopped

networks:
  default:
    name: soccer-manager-network