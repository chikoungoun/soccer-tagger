version: '3.8'

services:
  soccer-backend:
    build: .
    container_name: soccer-manager-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./soccer_manager.db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    volumes:
      # Persist database and uploads
      - ./soccer_manager.db:/app/soccer_manager.db
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: soccer-manager-network